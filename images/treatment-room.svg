<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="equipmentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Room background -->
  <rect width="400" height="300" fill="url(#roomGradient)"/>
  
  <!-- Floor -->
  <rect width="400" height="80" y="220" fill="#f5f5f5"/>
  
  <!-- Treatment bed -->
  <g transform="translate(200, 180)">
    <rect x="-60" y="0" width="120" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="-50" y="5" width="100" height="30" fill="#f8f9fa"/>
    <circle cx="-40" cy="20" r="3" fill="#e74c3c"/>
    <circle cx="40" cy="20" r="3" fill="#e74c3c"/>
  </g>
  
  <!-- Medical equipment -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="60" height="80" fill="url(#equipmentGradient)" stroke="#2196F3" stroke-width="2" rx="10"/>
    <rect x="10" y="10" width="40" height="60" fill="#ffffff"/>
    <circle cx="30" cy="40" r="15" fill="#4CAF50"/>
    <rect x="25" y="35" width="10" height="10" fill="#ffffff"/>
  </g>
  
  <!-- Laser device -->
  <g transform="translate(280, 120)">
    <rect x="0" y="0" width="50" height="40" fill="#2c3e50" rx="5"/>
    <rect x="5" y="5" width="40" height="30" fill="#34495e"/>
    <circle cx="25" cy="20" r="8" fill="#e74c3c"/>
    <line x1="25" y1="20" x2="60" y2="20" stroke="#e74c3c" stroke-width="3"/>
  </g>
  
  <!-- Skin analysis device -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="80" height="50" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="10" y="10" width="60" height="30" fill="#f0f0f0"/>
    <circle cx="40" cy="25" r="10" fill="#2196F3"/>
    <text x="40" y="30" text-anchor="middle" fill="white" font-size="8" font-weight="bold">SKIN</text>
  </g>
  
  <!-- Medical cabinet -->
  <g transform="translate(300, 50)">
    <rect x="0" y="0" width="80" height="120" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="5" y="5" width="70" height="110" fill="#f8f9fa"/>
    <rect x="10" y="10" width="60" height="20" fill="#e74c3c" rx="3"/>
    <rect x="10" y="35" width="60" height="15" fill="#4CAF50" rx="2"/>
    <rect x="10" y="55" width="60" height="15" fill="#FF9800" rx="2"/>
  </g>
  
  <!-- Ceiling lights -->
  <circle cx="100" cy="40" r="15" fill="#FFD700" opacity="0.8"/>
  <circle cx="200" cy="40" r="15" fill="#FFD700" opacity="0.8"/>
  <circle cx="300" cy="40" r="15" fill="#FFD700" opacity="0.8"/>
  
  <!-- Medical cross -->
  <g transform="translate(350, 200)">
    <rect x="-4" y="-15" width="8" height="30" fill="#e74c3c" rx="4"/>
    <rect x="-15" y="-4" width="30" height="8" fill="#e74c3c" rx="4"/>
  </g>
  
  <!-- Window -->
  <rect x="20" y="20" width="60" height="40" fill="#87CEEB" stroke="#2c3e50" stroke-width="2"/>
  <line x1="50" y1="20" x2="50" y2="60" stroke="#2c3e50" stroke-width="1"/>
  <line x1="20" y1="40" x2="80" y2="40" stroke="#2c3e50" stroke-width="1"/>
</svg>
