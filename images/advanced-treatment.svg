<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="laserGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdbcb4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4a6a6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Patient face -->
  <ellipse cx="200" cy="150" rx="60" ry="80" fill="url(#skinGradient)" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Eyes -->
  <ellipse cx="180" cy="120" rx="6" ry="10" fill="#2c3e50"/>
  <ellipse cx="220" cy="120" rx="6" ry="10" fill="#2c3e50"/>
  <ellipse cx="180" cy="120" rx="3" ry="5" fill="#ffffff"/>
  <ellipse cx="220" cy="120" rx="3" ry="5" fill="#ffffff"/>
  
  <!-- Nose -->
  <ellipse cx="200" cy="140" rx="3" ry="6" fill="#f4a6a6"/>
  
  <!-- Mouth -->
  <path d="M 180 170 Q 200 180 220 170" stroke="#2c3e50" stroke-width="2" fill="none"/>
  
  <!-- Laser treatment device -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="50" height="40" fill="#2c3e50" rx="5"/>
    <rect x="5" y="5" width="40" height="30" fill="#34495e"/>
    <circle cx="25" cy="20" r="6" fill="url(#laserGradient)"/>
    <line x1="25" y1="20" x2="80" y2="60" stroke="#e74c3c" stroke-width="3" opacity="0.8"/>
  </g>
  
  <!-- Multiple laser beams -->
  <g transform="translate(120, 100)">
    <line x1="0" y1="0" x2="60" y2="40" stroke="#e74c3c" stroke-width="2" opacity="0.6"/>
    <line x1="10" y1="5" x2="70" y2="45" stroke="#e74c3c" stroke-width="2" opacity="0.6"/>
    <line x1="-10" y1="10" x2="50" y2="50" stroke="#e74c3c" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Treatment monitoring screen -->
  <g transform="translate(280, 50)">
    <rect x="0" y="0" width="80" height="60" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="5" y="5" width="70" height="50" fill="#f0f0f0"/>
    <text x="40" y="20" text-anchor="middle" fill="#2c3e50" font-size="10" font-weight="bold">Treatment Monitor</text>
    <rect x="10" y="30" width="60" height="3" fill="#4CAF50"/>
    <rect x="10" y="40" width="50" height="3" fill="#FF9800"/>
    <rect x="10" y="50" width="55" height="3" fill="#2196F3"/>
  </g>
  
  <!-- Skin analysis device -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="60" height="40" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="5" y="5" width="50" height="30" fill="#f8f9fa"/>
    <circle cx="30" cy="20" r="8" fill="#4CAF50"/>
    <text x="30" y="25" text-anchor="middle" fill="white" font-size="6" font-weight="bold">SCAN</text>
  </g>
  
  <!-- Treatment progress -->
  <g transform="translate(150, 250)">
    <rect x="0" y="0" width="100" height="20" fill="#e0e0e0" rx="10"/>
    <rect x="0" y="0" width="75" height="20" fill="#4CAF50" rx="10"/>
    <text x="50" y="15" text-anchor="middle" fill="white" font-size="10" font-weight="bold">75% Complete</text>
  </g>
  
  <!-- Safety equipment -->
  <g transform="translate(320, 150)">
    <rect x="0" y="0" width="40" height="60" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="5" y="5" width="30" height="50" fill="#f0f0f0"/>
    <rect x="10" y="10" width="20" height="15" fill="#e74c3c" rx="2"/>
    <rect x="10" y="30" width="20" height="15" fill="#4CAF50" rx="2"/>
    <rect x="10" y="50" width="20" height="10" fill="#FF9800" rx="2"/>
  </g>
  
  <!-- Ceiling lights -->
  <circle cx="100" cy="30" r="10" fill="#FFD700" opacity="0.8"/>
  <circle cx="200" cy="30" r="10" fill="#FFD700" opacity="0.8"/>
  <circle cx="300" cy="30" r="10" fill="#FFD700" opacity="0.8"/>
  
  <!-- Medical cross -->
  <g transform="translate(350, 200)">
    <rect x="-3" y="-12" width="6" height="24" fill="#e74c3c" rx="3"/>
    <rect x="-12" y="-3" width="24" height="6" fill="#e74c3c" rx="3"/>
  </g>
</svg>
