<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="20" fill="url(#heroGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="80" cy="80" r="30" fill="url(#circleGradient)"/>
  <circle cx="320" cy="100" r="20" fill="url(#circleGradient)"/>
  <circle cx="350" cy="350" r="40" fill="url(#circleGradient)"/>
  <circle cx="50" cy="320" r="25" fill="url(#circleGradient)"/>
  
  <!-- Medical cross -->
  <g transform="translate(200, 200)">
    <rect x="-8" y="-30" width="16" height="60" fill="white" rx="8"/>
    <rect x="-30" y="-8" width="60" height="16" fill="white" rx="8"/>
  </g>
  
  <!-- Stethoscope -->
  <g transform="translate(150, 120) rotate(-15)">
    <ellipse cx="0" cy="0" rx="25" ry="15" fill="none" stroke="white" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="15" ry="8" fill="none" stroke="white" stroke-width="3"/>
    <line x1="0" y1="0" x2="80" y2="40" stroke="white" stroke-width="3"/>
    <circle cx="80" cy="40" r="8" fill="white"/>
  </g>
  
  <!-- Heart rate line -->
  <path d="M 50 300 Q 100 280 150 300 T 250 300 T 350 300" stroke="white" stroke-width="3" fill="none" opacity="0.8"/>
  
  <!-- Text -->
  <text x="200" y="280" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Dermathey</text>
  <text x="200" y="310" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" opacity="0.9">Paris</text>
</svg>
