<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinBefore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdbcb4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4a6a6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skinAfter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeaa7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdcb6e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Before section -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="120" height="200" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="10"/>
    <text x="60" y="20" text-anchor="middle" fill="#e74c3c" font-size="14" font-weight="bold">ДО</text>
    
    <!-- Face before -->
    <ellipse cx="60" cy="100" rx="40" ry="50" fill="url(#skinBefore)"/>
    
    <!-- Problem areas -->
    <circle cx="50" cy="80" r="3" fill="#8B4513"/>
    <circle cx="70" cy="85" r="2" fill="#8B4513"/>
    <circle cx="45" cy="110" r="2" fill="#8B4513"/>
    <circle cx="75" cy="115" r="3" fill="#8B4513"/>
    
    <!-- Redness -->
    <ellipse cx="60" cy="90" rx="25" ry="15" fill="#ff6b6b" opacity="0.3"/>
    
    <!-- Eyes -->
    <ellipse cx="50" cy="80" rx="4" ry="6" fill="#2c3e50"/>
    <ellipse cx="70" cy="80" rx="4" ry="6" fill="#2c3e50"/>
    
    <!-- Nose -->
    <ellipse cx="60" cy="100" rx="3" ry="5" fill="#f4a6a6"/>
    
    <!-- Mouth -->
    <path d="M 50 120 Q 60 125 70 120" stroke="#2c3e50" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- After section -->
  <g transform="translate(230, 50)">
    <rect x="0" y="0" width="120" height="200" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="10"/>
    <text x="60" y="20" text-anchor="middle" fill="#4CAF50" font-size="14" font-weight="bold">ПОСЛЕ</text>
    
    <!-- Face after -->
    <ellipse cx="60" cy="100" rx="40" ry="50" fill="url(#skinAfter)"/>
    
    <!-- Clear skin -->
    <circle cx="50" cy="80" r="1" fill="#4CAF50" opacity="0.5"/>
    <circle cx="70" cy="85" r="1" fill="#4CAF50" opacity="0.5"/>
    
    <!-- Healthy glow -->
    <ellipse cx="60" cy="90" rx="20" ry="12" fill="#ffeaa7" opacity="0.4"/>
    
    <!-- Eyes -->
    <ellipse cx="50" cy="80" rx="4" ry="6" fill="#2c3e50"/>
    <ellipse cx="70" cy="80" rx="4" ry="6" fill="#2c3e50"/>
    
    <!-- Nose -->
    <ellipse cx="60" cy="100" rx="3" ry="5" fill="#fdcb6e"/>
    
    <!-- Smile -->
    <path d="M 50 120 Q 60 130 70 120" stroke="#2c3e50" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(190, 150)">
    <path d="M 0 0 L 20 0 L 15 -5 M 20 0 L 15 5" stroke="#e74c3c" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Treatment info -->
  <g transform="translate(50, 270)">
    <rect x="0" y="0" width="300" height="20" fill="#e74c3c" rx="10"/>
    <text x="150" y="15" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Результат лечения акне - 3 месяца</text>
  </g>
  
  <!-- Progress indicators -->
  <g transform="translate(50, 260)">
    <circle cx="0" cy="0" r="3" fill="#e74c3c"/>
    <circle cx="20" cy="0" r="3" fill="#e74c3c"/>
    <circle cx="40" cy="0" r="3" fill="#4CAF50"/>
    <circle cx="60" cy="0" r="3" fill="#4CAF50"/>
    <circle cx="80" cy="0" r="3" fill="#4CAF50"/>
  </g>
</svg>
