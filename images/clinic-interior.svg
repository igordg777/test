<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="floorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f3f4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Floor -->
  <rect width="400" height="100" y="200" fill="url(#floorGradient)"/>
  
  <!-- Walls -->
  <rect width="400" height="200" fill="url(#wallGradient)"/>
  
  <!-- Window -->
  <rect x="50" y="50" width="120" height="80" fill="#87CEEB" stroke="#2c3e50" stroke-width="2"/>
  <line x1="110" y1="50" x2="110" y2="130" stroke="#2c3e50" stroke-width="2"/>
  <line x1="50" y1="90" x2="170" y2="90" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Door -->
  <rect x="250" y="120" width="60" height="80" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <circle cx="290" cy="160" r="3" fill="#FFD700"/>
  
  <!-- Medical equipment -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="40" height="60" fill="#E0E0E0" rx="5"/>
    <rect x="5" y="5" width="30" height="50" fill="#F0F0F0"/>
    <circle cx="20" cy="30" r="8" fill="#4CAF50"/>
  </g>
  
  <!-- Chair -->
  <g transform="translate(200, 150)">
    <rect x="0" y="0" width="30" height="30" fill="#8B4513"/>
    <rect x="5" y="5" width="20" height="20" fill="#A0522D"/>
  </g>
  
  <!-- Table -->
  <g transform="translate(150, 180)">
    <rect x="0" y="0" width="80" height="20" fill="#8B4513"/>
    <rect x="10" y="10" width="60" height="10" fill="#A0522D"/>
  </g>
  
  <!-- Plants -->
  <g transform="translate(320, 160)">
    <ellipse cx="0" cy="0" rx="15" ry="8" fill="#228B22"/>
    <ellipse cx="0" cy="-5" rx="12" ry="6" fill="#32CD32"/>
  </g>
  
  <!-- Ceiling light -->
  <circle cx="200" cy="30" r="20" fill="#FFD700" opacity="0.8"/>
  <circle cx="200" cy="30" r="15" fill="#FFFFE0"/>
  
  <!-- Medical cross on wall -->
  <g transform="translate(350, 100)">
    <rect x="-6" y="-20" width="12" height="40" fill="#e74c3c" rx="6"/>
    <rect x="-20" y="-6" width="40" height="12" fill="#e74c3c" rx="6"/>
  </g>
</svg>
