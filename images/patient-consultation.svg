<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="doctorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#roomGradient)"/>
  
  <!-- Doctor -->
  <g transform="translate(150, 100)">
    <!-- Doctor body -->
    <ellipse cx="0" cy="40" rx="30" ry="40" fill="url(#doctorGradient)" stroke="#2196F3" stroke-width="2"/>
    <!-- Doctor head -->
    <circle cx="0" cy="0" r="20" fill="#fdbcb4"/>
    <!-- Doctor hair -->
    <ellipse cx="0" cy="-15" rx="18" ry="12" fill="#2c3e50"/>
    <!-- Doctor eyes -->
    <circle cx="-8" cy="-5" r="2" fill="#2c3e50"/>
    <circle cx="8" cy="-5" r="2" fill="#2c3e50"/>
    <!-- Doctor mouth -->
    <path d="M -5 5 Q 0 10 5 5" stroke="#2c3e50" stroke-width="1.5" fill="none"/>
    <!-- Stethoscope -->
    <ellipse cx="-15" cy="0" rx="8" ry="4" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <line x1="-7" y1="0" x2="20" y2="15" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="20" cy="15" r="3" fill="#2c3e50"/>
  </g>
  
  <!-- Patient -->
  <g transform="translate(250, 120)">
    <!-- Patient body -->
    <ellipse cx="0" cy="35" rx="25" ry="35" fill="#fdbcb4"/>
    <!-- Patient head -->
    <circle cx="0" cy="0" r="18" fill="#fdbcb4"/>
    <!-- Patient hair -->
    <ellipse cx="0" cy="-12" rx="15" ry="10" fill="#8B4513"/>
    <!-- Patient eyes -->
    <circle cx="-6" cy="-3" r="2" fill="#2c3e50"/>
    <circle cx="6" cy="-3" r="2" fill="#2c3e50"/>
    <!-- Patient mouth -->
    <path d="M -4 8 Q 0 12 4 8" stroke="#2c3e50" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Consultation table -->
  <g transform="translate(200, 200)">
    <rect x="-60" y="0" width="120" height="20" fill="#8B4513"/>
    <rect x="-50" y="5" width="100" height="15" fill="#A0522D"/>
    <!-- Medical documents -->
    <rect x="-40" y="10" width="80" height="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="-30" y1="15" x2="30" y2="15" stroke="#2c3e50" stroke-width="1"/>
    <line x1="-30" y1="18" x2="20" y2="18" stroke="#2c3e50" stroke-width="1"/>
  </g>
  
  <!-- Medical equipment -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="40" height="60" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="5" y="5" width="30" height="50" fill="#f0f0f0"/>
    <circle cx="20" cy="30" r="8" fill="#4CAF50"/>
  </g>
  
  <!-- Computer screen -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="60" height="40" fill="#2c3e50" rx="5"/>
    <rect x="5" y="5" width="50" height="30" fill="#2196F3"/>
    <rect x="10" y="10" width="40" height="20" fill="#ffffff"/>
    <text x="30" y="25" text-anchor="middle" fill="#2c3e50" font-size="8">Skin Analysis</text>
  </g>
  
  <!-- Ceiling lights -->
  <circle cx="100" cy="40" r="12" fill="#FFD700" opacity="0.8"/>
  <circle cx="200" cy="40" r="12" fill="#FFD700" opacity="0.8"/>
  <circle cx="300" cy="40" r="12" fill="#FFD700" opacity="0.8"/>
  
  <!-- Window -->
  <rect x="20" y="20" width="80" height="60" fill="#87CEEB" stroke="#2c3e50" stroke-width="2"/>
  <line x1="60" y1="20" x2="60" y2="80" stroke="#2c3e50" stroke-width="1"/>
  <line x1="20" y1="50" x2="100" y2="50" stroke="#2c3e50" stroke-width="1"/>
  
  <!-- Medical cross -->
  <g transform="translate(350, 250)">
    <rect x="-4" y="-15" width="8" height="30" fill="#e74c3c" rx="4"/>
    <rect x="-15" y="-4" width="30" height="8" fill="#e74c3c" rx="4"/>
  </g>
</svg>
