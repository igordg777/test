<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdbcb4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4a6a6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="laserGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Face outline -->
  <ellipse cx="200" cy="150" rx="80" ry="100" fill="url(#skinGradient)" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Eyes -->
  <ellipse cx="170" cy="120" rx="8" ry="12" fill="#2c3e50"/>
  <ellipse cx="230" cy="120" rx="8" ry="12" fill="#2c3e50"/>
  <ellipse cx="170" cy="120" rx="4" ry="6" fill="#ffffff"/>
  <ellipse cx="230" cy="120" rx="4" ry="6" fill="#ffffff"/>
  
  <!-- Nose -->
  <ellipse cx="200" cy="140" rx="4" ry="8" fill="#f4a6a6"/>
  
  <!-- Mouth -->
  <path d="M 180 170 Q 200 180 220 170" stroke="#2c3e50" stroke-width="2" fill="none"/>
  
  <!-- Laser beam -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="15" fill="url(#laserGradient)" opacity="0.7"/>
    <circle cx="0" cy="0" r="8" fill="#e74c3c" opacity="0.9"/>
    <line x1="0" y1="0" x2="80" y2="40" stroke="#e74c3c" stroke-width="3" opacity="0.6"/>
  </g>
  
  <!-- Treatment device -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="40" height="60" fill="#2c3e50" rx="5"/>
    <rect x="5" y="5" width="30" height="50" fill="#34495e"/>
    <circle cx="20" cy="30" r="8" fill="#e74c3c"/>
    <line x1="20" y1="30" x2="60" y2="60" stroke="#e74c3c" stroke-width="2"/>
  </g>
  
  <!-- Skin analysis results -->
  <g transform="translate(280, 50)">
    <rect x="0" y="0" width="100" height="80" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="5" y="5" width="90" height="70" fill="#f8f9fa"/>
    <text x="50" y="25" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="bold">Skin Analysis</text>
    <rect x="10" y="35" width="80" height="3" fill="#4CAF50"/>
    <rect x="10" y="45" width="60" height="3" fill="#FF9800"/>
    <rect x="10" y="55" width="70" height="3" fill="#2196F3"/>
  </g>
  
  <!-- Medical tools -->
  <g transform="translate(320, 200)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <circle cx="0" cy="0" r="15" fill="#f0f0f0"/>
    <circle cx="0" cy="0" r="8" fill="#e74c3c"/>
  </g>
  
  <!-- Before/After indicators -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="80" height="30" fill="#e74c3c" rx="15"/>
    <text x="40" y="20" text-anchor="middle" fill="white" font-size="12" font-weight="bold">BEFORE</text>
  </g>
  
  <g transform="translate(270, 250)">
    <rect x="0" y="0" width="80" height="30" fill="#4CAF50" rx="15"/>
    <text x="40" y="20" text-anchor="middle" fill="white" font-size="12" font-weight="bold">AFTER</text>
  </g>
  
  <!-- Treatment progress -->
  <g transform="translate(150, 250)">
    <rect x="0" y="0" width="100" height="20" fill="#e0e0e0" rx="10"/>
    <rect x="0" y="0" width="75" height="20" fill="#4CAF50" rx="10"/>
    <text x="50" y="15" text-anchor="middle" fill="white" font-size="10" font-weight="bold">75%</text>
  </g>
</svg>
