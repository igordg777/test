<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plantGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#32CD32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#roomGradient)"/>
  
  <!-- Floor -->
  <rect width="400" height="80" y="220" fill="#f5f5f5"/>
  
  <!-- Relaxation chairs -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="60" height="40" fill="#8B4513" rx="5"/>
    <rect x="5" y="5" width="50" height="30" fill="#A0522D"/>
    <rect x="10" y="10" width="40" height="20" fill="#D2691E"/>
    <circle cx="30" cy="20" r="2" fill="#FFD700"/>
  </g>
  
  <g transform="translate(240, 180)">
    <rect x="0" y="0" width="60" height="40" fill="#8B4513" rx="5"/>
    <rect x="5" y="5" width="50" height="30" fill="#A0522D"/>
    <rect x="10" y="10" width="40" height="20" fill="#D2691E"/>
    <circle cx="30" cy="20" r="2" fill="#FFD700"/>
  </g>
  
  <!-- Coffee table -->
  <g transform="translate(170, 200)">
    <rect x="0" y="0" width="60" height="20" fill="#8B4513"/>
    <rect x="5" y="5" width="50" height="15" fill="#A0522D"/>
    <rect x="10" y="10" width="40" height="10" fill="#D2691E"/>
  </g>
  
  <!-- Plants -->
  <g transform="translate(50, 150)">
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="url(#plantGradient)"/>
    <ellipse cx="0" cy="-8" rx="15" ry="10" fill="#32CD32"/>
    <ellipse cx="0" cy="-15" rx="12" ry="8" fill="#228B22"/>
    <rect x="-2" y="0" width="4" height="30" fill="#8B4513"/>
  </g>
  
  <g transform="translate(350, 160)">
    <ellipse cx="0" cy="0" rx="18" ry="12" fill="url(#plantGradient)"/>
    <ellipse cx="0" cy="-6" rx="12" ry="8" fill="#32CD32"/>
    <ellipse cx="0" cy="-12" rx="10" ry="6" fill="#228B22"/>
    <rect x="-1.5" y="0" width="3" height="25" fill="#8B4513"/>
  </g>
  
  <!-- Magazines and books -->
  <g transform="translate(180, 190)">
    <rect x="0" y="0" width="30" height="25" fill="#e74c3c" rx="2"/>
    <rect x="5" y="5" width="20" height="15" fill="#ffffff"/>
    <text x="15" y="15" text-anchor="middle" fill="#2c3e50" font-size="6">SKIN</text>
  </g>
  
  <g transform="translate(210, 185)">
    <rect x="0" y="0" width="25" height="30" fill="#2196F3" rx="2"/>
    <rect x="3" y="3" width="19" height="24" fill="#ffffff"/>
    <text x="12.5" y="20" text-anchor="middle" fill="#2c3e50" font-size="5">HEALTH</text>
  </g>
  
  <!-- Water dispenser -->
  <g transform="translate(300, 120)">
    <rect x="0" y="0" width="40" height="80" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="5" y="5" width="30" height="70" fill="#f0f0f0"/>
    <rect x="10" y="10" width="20" height="60" fill="#87CEEB"/>
    <circle cx="20" cy="40" r="3" fill="#ffffff"/>
    <rect x="15" y="60" width="10" height="5" fill="#ffffff"/>
  </g>
  
  <!-- Ceiling lights -->
  <circle cx="100" cy="40" r="15" fill="#FFD700" opacity="0.8"/>
  <circle cx="200" cy="40" r="15" fill="#FFD700" opacity="0.8"/>
  <circle cx="300" cy="40" r="15" fill="#FFD700" opacity="0.8"/>
  
  <!-- Window -->
  <rect x="20" y="20" width="100" height="80" fill="#87CEEB" stroke="#2c3e50" stroke-width="2"/>
  <line x1="70" y1="20" x2="70" y2="100" stroke="#2c3e50" stroke-width="1"/>
  <line x1="20" y1="60" x2="120" y2="60" stroke="#2c3e50" stroke-width="1"/>
  
  <!-- Medical cross -->
  <g transform="translate(350, 250)">
    <rect x="-4" y="-15" width="8" height="30" fill="#e74c3c" rx="4"/>
    <rect x="-15" y="-4" width="30" height="8" fill="#e74c3c" rx="4"/>
  </g>
  
  <!-- Relaxation sign -->
  <g transform="translate(200, 50)">
    <rect x="-40" y="0" width="80" height="30" fill="#4CAF50" rx="15"/>
    <text x="0" y="20" text-anchor="middle" fill="white" font-size="12" font-weight="bold">RELAXATION AREA</text>
  </g>
</svg>
