<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="equipmentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Main medical device -->
  <g transform="translate(200, 150)">
    <rect x="-60" y="-40" width="120" height="80" fill="url(#equipmentGradient)" stroke="#e0e0e0" stroke-width="2" rx="10"/>
    <rect x="-50" y="-30" width="100" height="60" fill="url(#screenGradient)"/>
    <circle cx="0" cy="0" r="25" fill="#4CAF50"/>
    <circle cx="0" cy="0" r="15" fill="#ffffff"/>
    <text x="0" y="5" text-anchor="middle" fill="#2c3e50" font-size="8" font-weight="bold">SKIN</text>
  </g>
  
  <!-- Laser device -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="60" height="40" fill="#2c3e50" rx="5"/>
    <rect x="5" y="5" width="50" height="30" fill="#34495e"/>
    <circle cx="30" cy="20" r="8" fill="#e74c3c"/>
    <line x1="30" y1="20" x2="80" y2="50" stroke="#e74c3c" stroke-width="3"/>
  </g>
  
  <!-- Microscope -->
  <g transform="translate(300, 120)">
    <rect x="0" y="0" width="50" height="60" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="5" y="5" width="40" height="50" fill="#f0f0f0"/>
    <circle cx="25" cy="30" r="12" fill="#2196F3"/>
    <circle cx="25" cy="30" r="6" fill="#ffffff"/>
    <rect x="20" y="45" width="10" height="15" fill="#8B4513"/>
  </g>
  
  <!-- Skin analysis scanner -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="80" height="60" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="5" y="5" width="70" height="50" fill="#f8f9fa"/>
    <rect x="15" y="15" width="50" height="30" fill="#4CAF50" rx="3"/>
    <text x="40" y="35" text-anchor="middle" fill="white" font-size="10" font-weight="bold">SCAN</text>
  </g>
  
  <!-- Treatment chair -->
  <g transform="translate(250, 200)">
    <rect x="0" y="0" width="60" height="40" fill="#8B4513" rx="5"/>
    <rect x="5" y="5" width="50" height="30" fill="#A0522D"/>
    <rect x="10" y="10" width="40" height="20" fill="#D2691E"/>
    <circle cx="30" cy="20" r="3" fill="#FFD700"/>
  </g>
  
  <!-- Medical cabinet -->
  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="60" height="100" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="5" y="5" width="50" height="90" fill="#f8f9fa"/>
    <rect x="10" y="10" width="40" height="15" fill="#e74c3c" rx="2"/>
    <rect x="10" y="30" width="40" height="15" fill="#4CAF50" rx="2"/>
    <rect x="10" y="50" width="40" height="15" fill="#FF9800" rx="2"/>
    <rect x="10" y="70" width="40" height="15" fill="#2196F3" rx="2"/>
  </g>
  
  <!-- Ceiling lights -->
  <circle cx="100" cy="40" r="12" fill="#FFD700" opacity="0.8"/>
  <circle cx="200" cy="40" r="12" fill="#FFD700" opacity="0.8"/>
  <circle cx="300" cy="40" r="12" fill="#FFD700" opacity="0.8"/>
  
  <!-- Medical cross -->
  <g transform="translate(350, 200)">
    <rect x="-4" y="-15" width="8" height="30" fill="#e74c3c" rx="4"/>
    <rect x="-15" y="-4" width="30" height="8" fill="#e74c3c" rx="4"/>
  </g>
  
  <!-- Data display -->
  <g transform="translate(150, 50)">
    <rect x="0" y="0" width="100" height="60" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
    <rect x="5" y="5" width="90" height="50" fill="#f8f9fa"/>
    <text x="50" y="20" text-anchor="middle" fill="#2c3e50" font-size="10" font-weight="bold">Skin Analysis</text>
    <rect x="10" y="30" width="80" height="3" fill="#4CAF50"/>
    <rect x="10" y="40" width="60" height="3" fill="#FF9800"/>
    <rect x="10" y="50" width="70" height="3" fill="#2196F3"/>
  </g>
</svg>
